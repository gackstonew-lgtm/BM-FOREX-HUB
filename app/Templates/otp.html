<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Verification Code</title>
<style>
  body { margin: 0; padding: 0; background-color: #0A0E14; color: #E8E6DE; font-family: 'Inter', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrapper { width: 100%; background-color: #0A0E14; padding: 40px 0; }
  .main-card { background-color: #10161F; border: 1px solid #232B38; border-radius: 12px; max-width: 500px; margin: 0 auto; overflow: hidden; text-align: center; }
  .header { padding: 28px; border-bottom: 1px solid #232B38; background: linear-gradient(180deg, #161D29 0%, #10161F 100%); }
  .logo { width: 56px; height: 56px; border-radius: 50%; display: block; margin: 0 auto 10px; }
  .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: #E8E6DE; margin: 0; text-transform: uppercase; }
  .content { padding: 32px 24px; color: #E8E6DE; }
  .otp-box { background: rgba(212, 162, 76, 0.1); border: 1px solid rgba(212, 162, 76, 0.3); border-radius: 10px; padding: 20px; margin: 24px 0; display: inline-block; }
  .otp-code { font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 700; color: #D4A24C; letter-spacing: 0.25em; }
  .hint { font-size: 13px; color: #8B93A3; margin-top: 12px; }
  .footer { padding: 20px; border-top: 1px solid #232B38; font-size: 12px; color: #5B6472; background-color: #0A0E14; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="main-card">
    <div class="header">
      <img src="{app_logo}" alt="BM Forex Hub" class="logo">
      <h1 class="brand-title">BM Forex Hub</h1>
    </div>
    <div class="content">
      <h2 style="font-family:'Space Grotesk',sans-serif;color:#E8E6DE;font-size:20px;margin-top:0;">{title}</h2>
      <p style="font-size:14px;color:#8B93A3;">Use the verification code below to complete your authentication request:</p>
      
      <div class="otp-box">
        <span class="otp-code">{otp_code}</span>
      </div>

      <p class="hint">This code is valid for <strong>15 minutes</strong>. If you did not request this code, please ignore this email.</p>
    </div>
    <div class="footer">
      &copy; {year} BM Forex Hub. All rights reserved.
    </div>
  </div>
</div>
</body>
</html>
