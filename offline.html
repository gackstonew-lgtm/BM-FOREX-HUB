<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline | BM FOREX HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --void: #0B0F14;
    --panel: #101722;
    --hairline: #283548;
    --ink: #FFFFFF;
    --muted: #B8C3D1;
    --primary: #1677FF;
    --primary-hover: #2F80FF;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--void);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .offline-card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    max-width: 460px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }
  .offline-logo {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
  }
  .offline-badge {
    display: inline-block;
    background: rgba(246, 70, 93, 0.15);
    color: #F6465D;
    border: 1px solid rgba(246, 70, 93, 0.3);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
  }
  p {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.55;
    margin-bottom: 24px;
  }
  .offline-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .btn-retry {
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .btn-retry:hover {
    background: var(--primary-hover);
  }
  .btn-retry:active {
    transform: scale(0.98);
  }
  .status-text {
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.7;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="offline-card">
    <img src="BM-ForexHub-Logo-Circle.png" alt="BM Forex Hub" class="offline-logo">
    <div>
      <span class="offline-badge">Connection Lost</span>
    </div>
    <h1>You are Currently Offline</h1>
    <p>BM Forex Hub live forex signals, real-time market data, and account features require an active internet connection.</p>
    <div class="offline-actions">
      <button type="button" class="btn-retry" onclick="window.location.reload()">Try Reconnecting</button>
    </div>
    <div class="status-text" id="statusText">Checking connection...</div>
  </div>

  <script>
    function updateOnlineStatus() {
      var st = document.getElementById('statusText');
      if (navigator.onLine) {
        st.textContent = 'Connection restored! Reloading...';
        st.style.color = '#16C784';
        setTimeout(function() { window.location.reload(); }, 1200);
      } else {
        st.textContent = 'Device is currently offline.';
        st.style.color = '#F6465D';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
